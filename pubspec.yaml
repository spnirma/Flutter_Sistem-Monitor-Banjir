name: sistem_banjir
description: Sistem Pemantauan dan Pelaporan Banjir - Sistem Drainase Pintar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── HTTP & API ─────────────────────────────────────
  dio: ^5.4.0                        # HTTP client ke Laravel API

  # ── State management ───────────────────────────────
  flutter_riverpod: ^2.5.1           # state management (Provider, Notifier)
  riverpod_annotation: ^2.3.5        # anotasi opsional

  # ── Navigasi ───────────────────────────────────────
  go_router: ^13.2.0                 # declarative routing + guard role

  # ── Storage ────────────────────────────────────────
  flutter_secure_storage: ^9.0.0     # simpan token JWT secara aman

  # ── Peta ───────────────────────────────────────────
  flutter_map: ^7.0.2                # OpenStreetMap widget
  latlong2: ^0.9.1                   # LatLng class untuk flutter_map

  # ── Gambar / kamera ────────────────────────────────
  image_picker: ^1.0.7               # pilih foto dari kamera/galeri

  # ── Utilitas ───────────────────────────────────────
  intl: ^0.19.0                      # format tanggal (opsional, kita pakai manual)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
